<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas Personales</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

    <h1>💰 Mis Finanzas Personales</h1>

    <div class="resumen">

        <div class="card ingresos">
            <h3>Ingresos</h3>
            <p id="totalIngresos">$0.00</p>
        </div>

        <div class="card gastos">
            <h3>Gastos</h3>
            <p id="totalGastos">$0.00</p>
        </div>

        <div class="card saldo">
            <h3>Saldo</h3>
            <p id="saldo">$0.00</p>
        </div>

    </div>

    <div class="formulario">

        <input type="text" id="descripcion" placeholder="Descripción">

        <input type="number" id="cantidad" placeholder="Cantidad">

        <select id="tipo">
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
        </select>

        <select id="categoria">
            <option value="Comida">🍔 Comida</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Casa">🏠 Casa</option>
            <option value="Entretenimiento">🎮 Entretenimiento</option>
            <option value="Salud">❤️ Salud</option>
            <option value="Educacion">📚 Educación</option>
            <option value="Otros">📦 Otros</option>
        </select>

        <button onclick="agregarMovimiento()">
            Agregar Movimiento
        </button>

    </div>

    <h2>Movimientos</h2>

    <div id="listaMovimientos"></div>

    <h2>Gráfica de Gastos</h2>

    <canvas id="grafica"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
